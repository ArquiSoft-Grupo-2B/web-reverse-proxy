worker_processes auto;

events {
  worker_connections 1024;
}


http {
    # Formato de log personalizado que muestra el servidor upstream
    log_format upstream_log '[$time_local] Client: $remote_addr - '
                           'Request: "$request" - '
                           'Status: $status - '
                           'Upstream: $upstream_addr - '
                           'Backend Server: $upstream_addr';
    
    access_log /var/log/nginx/access.log upstream_log;
    
    
    # Configuración del balanceador de carga
    upstream frontend_backend {
        
        # Servidores backend (IPs mock - cambiar según necesidad)
        server runpath_frontend:3001 weight=1 max_fails=3 fail_timeout=30s;
        server frontend-ssr-1:3002 weight=1 max_fails=3 fail_timeout=30s;
        server frontend-ssr-2:3003 weight=1 max_fails=3 fail_timeout=30s;
        
        # Mantener conexiones persistentes
        keepalive 32;
    }
    
    server {
        listen 8555;
        server_name localhost;

        location / {
            # Usar el balanceador de carga
            proxy_pass http://frontend_backend;
            
            # Headers para el proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Configuración de timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Soporte para conexiones persistentes
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /health {
            return 200 'Reverse Proxy is up and running\n';
        }

    
    }
}
